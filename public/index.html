<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Buen Corte - Reservar cita</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>El Buen Corte</h1>
    <p class="subtitle">Reserva tu cita</p>

    <label>Servicio</label>
    <select id="servicio"></select>

    <label>Fecha</label>
    <input type="date" id="fecha">

    <label>Horarios disponibles</label>
    <div id="horarios" class="horarios-grid"></div>

    <label>Nombre completo</label>
    <input type="text" id="nombre" placeholder="Escribe tu nombre" maxlength="100">

    <label>Número de WhatsApp</label>
    <input type="tel" id="telefono" placeholder="Ej: 300 123 4567" inputmode="numeric" autocomplete="tel" maxlength="16">

    <label class="check">
      <input type="checkbox" id="acepta">
      Autorizo el uso de mi nombre y número de WhatsApp para gestionar mi cita y contactarme sobre ella.
    </label>

    <button id="btnReservar">Confirmar reserva</button>
    <p id="mensaje"></p>
  </div>

  <script src="cliente.js"></script>
</body>
</html>
