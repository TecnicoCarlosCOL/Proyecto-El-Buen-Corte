<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Buen Corte - Agenda</title>
<link rel="stylesheet" href="style.css">
<style>
  .agenda-card { max-width: 1000px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; }

  .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  .badge.pendiente { background: #fdecc8; color: #a66a00; }
  .badge.atendida { background: #d5f0e3; color: #1e7a4d; }
  .badge.cancelada { background: #fbd9d9; color: #a12b2b; }

  .acciones { white-space: nowrap; }
  .acciones button {
    font-size: 12px; padding: 5px 10px; margin: 2px 4px 2px 0;
    border-radius: 6px; border: 1px solid #999; background: white; color: #333;
    width: auto; display: inline-block; cursor: pointer;
  }

  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  #logout {
    background: none; border: none; color: #888; font-size: 13px; cursor: pointer;
    text-decoration: underline; width: auto; margin: 0; padding: 0;
  }

  .tabs, .nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .tabs button, .nav button {
    width: auto; margin: 0; padding: 7px 14px; font-size: 13px;
    background: white; color: #333; border: 1px solid #999; border-radius: 6px; cursor: pointer;
  }
  .tabs button.activo { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  .nav .etiqueta { flex: 1; min-width: 160px; text-align: center; font-weight: 600; font-size: 14px; text-transform: capitalize; }
  .nav input[type=date] { width: auto; padding: 6px; font-size: 13px; }

  /* Vista semana */
  .tabla-scroll { overflow-x: auto; }
  table.semana { table-layout: fixed; min-width: 760px; }
  table.semana th, table.semana td {
    border: 1px solid #eee; padding: 6px; vertical-align: top; text-align: center; font-size: 12px; height: 56px;
  }
  table.semana thead th { cursor: pointer; }
  table.semana th.hoy { background: #eaf3fb; color: #2980b9; }
  .chip { border-radius: 6px; padding: 5px 6px; margin-bottom: 4px; text-align: left; cursor: pointer; font-size: 12px; font-weight: 600; }
  .chip small { display: block; font-weight: 400; opacity: 0.8; }
  .chip.pendiente { background: #fdecc8; color: #a66a00; }
  .chip.atendida { background: #d5f0e3; color: #1e7a4d; }

  /* Vista día */
  .turno { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; align-items: flex-start; }
  .turno .hora { width: 60px; font-weight: 600; color: #666; padding-top: 6px; }
  .turno .citas { flex: 1; }
  .libre { color: #aaa; font-size: 13px; padding-top: 6px; }
  .cita-card {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
  }
  .cita-card small { display: block; color: #777; }
  .cita-card.cancelada { opacity: 0.55; }
</style>
</head>
<body>
  <div class="card agenda-card">
    <div class="top-bar">
      <div>
        <h1>Agenda</h1>
        <p class="subtitle">El Buen Corte</p>
      </div>
      <button id="logout">Cerrar sesión</button>
    </div>

    <div class="tabs">
      <button id="tab-dia">Día</button>
      <button id="tab-semana" class="activo">Semana</button>
      <button id="tab-lista">Lista</button>
    </div>

    <div class="nav" id="nav">
      <button id="btnAnterior">‹ Anterior</button>
      <button id="btnHoy">Hoy</button>
      <button id="btnSiguiente">Siguiente ›</button>
      <span class="etiqueta" id="etiqueta"></span>
      <input type="date" id="saltoFecha">
    </div>

    <div id="contenido"></div>
    <p id="mensaje"></p>
  </div>

  <script src="agenda.js"></script>
</body>
</html>
